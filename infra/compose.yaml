name: our-tomorrow

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-environment: &api-environment
  NODE_ENV: ${NODE_ENV:-development}
  API_PORT: 3000
  DATABASE_URL: ${DATABASE_URL:-postgresql://our_tomorrow:our_tomorrow@postgres:5432/our_tomorrow?schema=public}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
  TRUST_PROXY: "1"
  TZ: Asia/Shanghai

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-our_tomorrow}
      POSTGRES_USER: ${POSTGRES_USER:-our_tomorrow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-our_tomorrow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5433}:5432
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  migrate:
    image: our-tomorrow-api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    command:
      [
        "/workspace/apps/api/node_modules/.bin/prisma",
        "migrate",
        "deploy",
        "--schema",
        "prisma/schema.prisma",
      ]
    environment:
      <<: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    restart: "no"
    logging: *default-logging

  api:
    image: our-tomorrow-api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-environment
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app
      - data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3000/api/v1/health/ready",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *default-logging

  web:
    image: our-tomorrow-web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_SITE_ADDRESS: ${APP_SITE_ADDRESS:-http://localhost}
    ports:
      - ${CADDY_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-80}:80
      - ${CADDY_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - app
    logging: *default-logging

networks:
  app:
  data:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
