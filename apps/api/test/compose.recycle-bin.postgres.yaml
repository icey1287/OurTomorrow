name: our-tomorrow-recycle-bin-integration-test

services:
  postgres:
    image: ${POSTGRES_TEST_IMAGE:-postgres:15}
    environment:
      POSTGRES_DB: our_tomorrow_recycle_test
      POSTGRES_USER: our_tomorrow_recycle
      POSTGRES_PASSWORD: recycle-integration-password
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U our_tomorrow_recycle -d our_tomorrow_recycle_test",
        ]
      interval: 2s
      timeout: 2s
      retries: 20
    security_opt:
      - no-new-privileges:true
