name: Security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (advisory)
        id: audit
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

      - name: Report audit advice
        if: ${{ !cancelled() && steps.audit.outcome == 'failure' }}
        run: |
          echo "::warning::Dependency audit reported findings or could not complete. Review the audit log; this check is advisory."
          echo "Dependency audit needs attention. Findings or scanner errors are recorded in the audit step and do not block CI." >> "$GITHUB_STEP_SUMMARY"

  repository-scan:
    name: Secrets, vulnerabilities, and misconfiguration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the workspace (advisory)
        id: scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Report scan advice
        if: ${{ !cancelled() && steps.scan.outcome == 'failure' }}
        run: |
          echo "::warning::Repository scan reported findings or could not complete. Review the scan log; this check is advisory."
          echo "Repository scan needs attention. Findings or scanner errors are recorded in the scan step and do not block CI." >> "$GITHUB_STEP_SUMMARY"
