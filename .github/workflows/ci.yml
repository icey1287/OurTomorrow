name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_VERSION: "22"
  PNPM_VERSION: "10.33.0"

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build workspace
        run: pnpm build

      - name: Smoke API startup and OpenAPI
        run: pnpm test:openapi

  api-integration:
    name: API migration and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: our_tomorrow_test
          POSTGRES_USER: our_tomorrow
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U our_tomorrow -d our_tomorrow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://our_tomorrow:test-only-password@127.0.0.1:5432/our_tomorrow_test?schema=public
      PUBLIC_APP_URL: http://localhost:5173
      WEB_ORIGIN: http://localhost:5173
      MEDIA_STORAGE_PATH: /tmp/our-tomorrow-ci-media
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations to a clean database
        run: pnpm --filter @our-tomorrow/api exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Run API unit tests
        run: pnpm --filter @our-tomorrow/api test:unit

      - name: Run API integration tests
        run: pnpm --filter @our-tomorrow/api test:integration

  containers:
    name: Compose and container images
    runs-on: ubuntu-latest
    needs:
      - quality
      - api-integration
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose model
        run: docker compose -f infra/compose.yaml config --quiet

      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          --env APP_SITE_ADDRESS=http://localhost
          --volume "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine
          validate --config /etc/caddy/Caddyfile

      - name: Build runtime images
        run: docker compose -f infra/compose.yaml build api web backup
